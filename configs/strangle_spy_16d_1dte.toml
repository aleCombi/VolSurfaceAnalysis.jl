# Daily short strangle on SPY: short 16-delta put + short 16-delta call,
# 1-DTE, one contract per leg, opened once a day at 19:30 UTC. Full-history
# window -- spans the entire SPY spot-data range (spots start 2016-03-28;
# options go back further, but per-leg expiry settlement is spot-bound).
#
# Show the result:
#   julia --project=. scripts/run_experiment.jl configs/strangle_spy_16d_1dte.toml
# Save it to the KB (also writes the equity-curve artifact):
#   julia --project=. scripts/run_experiment.jl configs/strangle_spy_16d_1dte.toml --save
# Render the equity curve to a scratch dir without saving:
#   julia --project=. scripts/run_experiment.jl configs/strangle_spy_16d_1dte.toml --out-dir C:/tmp
#
# The [data.*] roots point at the local Polygon trees; edit them to your
# data path. They are part of the run_id hash (the reserved `dataset`
# slot), so the same experiment on a machine with the data elsewhere gets
# a distinct id.

name  = "strangle_spy_16d_1dte"
from  = 2016-03-28T00:00:00
to    = 2026-03-27T23:59:59
clock = { kind = "option_quote", underlying = "SPY" }

[outputs]
metrics = ["sharpe", "sortino", "max_drawdown", "volatility", "profit_factor"]

[data.option_bar]
type = "parquet_option_bars"
root = "C:/repos/options-collector/data/massive/options_1min"

[data.option_quote]
type = "from_bars"
synthesizer = { type = "ohlcv_spread", lambda = 0.7 }

[data.spot_price]
type = "parquet_spots"
root = "C:/repos/options-collector/data/massive/spots_1min"

[data.rate_curve]
type     = "constant"
currency = "USD"
value    = 0.045

[data.div_curve]
type       = "constant"
underlying = "SPY"
value      = 0.013

[data.vol_surface]
type     = "surface_from"
currency = "USD"

[agent]
type = "static"

[agent.policy]
type        = "daily_short_strangle"
underlying  = "SPY"
entry_time  = 19:30:00
expiry_days = 1
put_delta   = 0.16
call_delta  = 0.16
quantity    = 1.0
