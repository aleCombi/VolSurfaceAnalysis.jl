# First end-to-end experiment: NoOpPolicy over the real parquet trees.
#
# This config is the canonical "does the experiment runner wire together
# correctly" smoke test. The policy never trades, so the run produces
# zero positions and zero PnL -- the value is in confirming that
# loader, engine, metrics, and printer cooperate end to end.
#
# Running it requires a Polygon-style parquet tree: options under
# `options_1min/`, spots under `spots_1min/`. Each [data.*] table names
# the tree it reads; edit the roots to match your data. The roots are
# part of the run_id hash (the reserved `dataset` slot), so the same
# experiment on a machine with the data elsewhere gets a distinct id.

name  = "noop_smoke"
from  = 2024-01-16T14:30:00
to    = 2024-01-16T14:35:00
clock = { kind = "option_quote", underlying = "SPY" }

[outputs]
metrics = ["sharpe", "max_drawdown"]

[data.option_bar]
type = "parquet_option_bars"
root = "C:/repos/options-collector/data/massive/options_1min"

[data.option_quote]
type = "from_bars"
synthesizer = { type = "ohlcv_spread", lambda = 0.7 }

[data.spot_price]
type = "parquet_spots"
root = "C:/repos/options-collector/data/massive/spots_1min"

[data.rate_curve]
type     = "constant"
currency = "USD"
value    = 0.04

[data.div_curve]
type       = "constant"
underlying = "SPY"
value      = 0.015

[data.vol_surface]
type     = "surface_from"
currency = "USD"

[agent]
type = "static"

[agent.policy]
type = "noop"
